services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    restart: always

  backend:
    build: .  # Portainer que usa el Dockerfile de la raíz
    ports:
      - "8081:8080"
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?sslmode=disable
    restart: always

  backend-init:
    build: 
      context: .
      target: builder 
    command: make seed-debug
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?sslmode=disable
    restart: always

volumes:
  postgres_data:
