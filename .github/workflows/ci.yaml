name: CI/CD Pipeline
on:
  push:
    branches: [ main, despliegue ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Levantar base de datos
        run: make postgres
        env:
          # Rellenamos las variables de entorno secretas
          # con unas de repuesto
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: laser_chess_db
          DB_PORT: 5432

      - name: Instalar golang
        uses: actions/setup-go@v6
        with: 
          go-version: '1.25.7'
    
      - name: Instalar sqlc
        uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: '1.30.0'

      - name: Esperar a que postgresql termine de levantarse
        run: |
          until docker exec postgres_db pg_isready -U $DB_USER
          do
            sleep 2
          done
        env:
          DB_USER: user
         
      - name: Aplicar esquema, inserciones debug y hacer la build
        run: |
          make reset-db-debug
          make build
        env:
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: laser_chess_db
          DB_PORT: 5432
          DB_URL: "postgresql://user:password@localhost:5432/laser_chess_db?sslmode=disable"
          AI_PASSWORD: '1234567890'
          # Hacer que se ejecute en modo release
          GIN_MODE: release

      - name: Ejecutar tests
        run: go test -v -cover -race ./...
        env:
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: laser_chess_db
          DB_PORT: 5432
          DB_URL: "postgresql://user:password@localhost:5432/laser_chess_db?sslmode=disable"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre del repo a minúsculas
        # Docker odia las mayúsculas en los nombres de las imágenes. Esto lo previene.
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Construir y subir imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend  # Apunta a la etapa 'backend' del dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:latest

      - name: Construir y subir imagen del Seeder
        uses: docker/build-push-action@v5
        with:
          context: .
          target: seeder   # Apunta a la etapa 'seeder' del dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-seeder:latest
          
      
